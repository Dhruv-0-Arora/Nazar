<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme Inventory</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 2rem;
  }
  h1 { font-size: 1.6rem; font-weight: 500; color: #8b949e; letter-spacing: 0.08em; }
  #panel {
    width: min(720px, 100%);
    border-radius: 16px;
    padding: 3rem 2.5rem;
    text-align: center;
    border: 2px solid #30363d;
    transition: background 0.3s, border-color 0.3s;
  }
  #panel.ok { background: #0f2417; border-color: #2ea043; }
  #panel.bad { background: #2d1215; border-color: #f85149; }
  #status { font-size: 4rem; font-weight: 700; letter-spacing: 0.04em; }
  #panel.ok #status { color: #3fb950; }
  #panel.bad #status { color: #f85149; }
  #detail { margin-top: 1.2rem; font-size: 1.3rem; color: #8b949e; }
  table { margin: 1.8rem auto 0; border-collapse: collapse; font-size: 1.25rem; }
  th, td { padding: 0.45rem 1.4rem; border-bottom: 1px solid #30363d; text-align: left; }
  th { color: #8b949e; font-weight: 500; text-transform: uppercase; font-size: 0.9rem; }
  #meta { font-size: 1rem; color: #484f58; }
</style>
</head>
<body>
  <h1>ACME INVENTORY DASHBOARD</h1>
  <div id="panel">
    <div id="status">STARTING&hellip;</div>
    <div id="detail">Waiting for first poll of /api/items.</div>
  </div>
  <div id="meta">polling /api/items every 2 s</div>

<script>
  const panel = document.getElementById('panel');
  const statusEl = document.getElementById('status');
  const detailEl = document.getElementById('detail');
  const metaEl = document.getElementById('meta');

  function renderOk(rows) {
    panel.className = 'ok';
    statusEl.textContent = 'OK';
    let html = '<table><tr><th>ID</th><th>SKU</th><th>Name</th><th>Qty</th></tr>';
    for (const r of rows) {
      html += `<tr><td>${r.id}</td><td>${r.sku}</td><td>${r.name}</td><td>${r.qty}</td></tr>`;
    }
    html += '</table>';
    detailEl.innerHTML = html;
  }

  function renderBad(message) {
    panel.className = 'bad';
    statusEl.textContent = 'BACKEND UNAVAILABLE';
    detailEl.textContent = message;
  }

  async function poll() {
    try {
      const res = await fetch('/api/items', { cache: 'no-store' });
      const body = await res.json();
      if (res.ok && body.rows) {
        renderOk(body.rows);
      } else {
        renderBad(body.error || `unexpected status ${res.status}`);
      }
    } catch (err) {
      renderBad(err.message);
    }
    metaEl.textContent = `polling /api/items every 2 s - last poll ${new Date().toLocaleTimeString()}`;
  }

  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
